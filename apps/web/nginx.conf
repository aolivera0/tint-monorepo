server {
  listen 5173;
  root /usr/share/nginx/html;
  index index.html;

  # Los assets llevan hash en el nombre: se cachean sin revalidar.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Rutas de la SPA (react-router): cualquier ruta devuelve index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
