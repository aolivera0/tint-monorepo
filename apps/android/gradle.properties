org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# URLs del backend (mismos servicios que apps/web/.env.example). Se pueden sobrescribir
# por compilación: ./gradlew assembleDebug -PtintIdentityApiUrl=https://host/api/v1
# En la tablet por adb, `adb reverse tcp:8081 tcp:8081` (y 8082, 8083) hace que localhost llegue al PC.
tintIdentityApiUrl=http://localhost:8081/api/v1
tintSyncWsUrl=ws://localhost:8083/ws/sync
tintSocialWsUrl=ws://localhost:8082/ws/social

# Host de los links de invitación https://<host>/invite/<código> que abren la app.
tintInviteHost=tint.jaucor.online
