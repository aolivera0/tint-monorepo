# Entorno local de TINT: PostgreSQL, Redis, MinIO, identity-api, web, media-worker, analytics, social-core y sync-core.
# Uso: cp .env.example .env && docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: tint-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tint}
      POSTGRES_DB: ${POSTGRES_DB:-tint}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tint} -d ${POSTGRES_DB:-tint}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tint-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    #image: minio/minio:latest
    image: pgsty/minio:latest # Usamos la imagen pgsty dado que la oficial de minio no está disponible actualmente.
    container_name: tint-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tintadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tintadmin123}
      # El navegador sube y reproduce directo desde MinIO con URLs firmadas.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:5173}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea el bucket de media al arrancar y termina.
  minio-init:
    #image: minio/mc:latest
    image: pgsty/mc:latest # Usamos la imagen pgsty dado que la oficial de minio no está disponible actualmente.
    container_name: tint-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      echo '{\"Rules\":[{\"ID\":\"incoming-expira\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"incoming/\"},\"Expiration\":{\"Days\":2}}]}' |
      mc ilm import local/$${MINIO_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tintadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tintadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-tint-media}

  # Migraciones de Drizzle de identity-api: se ejecutan una vez y terminan.
  identity-migrate:
    build:
      context: ./services/identity-api
      target: migrate
    container_name: tint-identity-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tint}:${POSTGRES_PASSWORD:-tint}@postgres:5432/${POSTGRES_DB:-tint}
    restart: "no"

  # identity-api (Node 22 + Express): usuarios, salas, tokens y subida de vídeo.
  # JWT_* deben ser los mismos que usan sync-core, social-core y analytics.
  identity-api:
    build:
      context: ./services/identity-api
      target: runtime
    container_name: tint-identity-api
    restart: unless-stopped
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      IDENTITY_API_PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-tint}:${POSTGRES_PASSWORD:-tint}@postgres:5432/${POSTGRES_DB:-tint}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      JWT_ISSUER: ${JWT_ISSUER:-tint-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tint:room}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-tint-login}
      # MinIO: el servicio habla con el host interno; la URL firmada que ve el navegador usa el público.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-tintadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-tintadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-tint-media}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/api/v1/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web (React + Vite compilado, servido por nginx). Las URLs VITE_* son las que ve el
  # navegador y se incrustan al compilar: si las cambias, reconstruye con --build.
  web:
    build:
      context: ./apps/web
      args:
        VITE_IDENTITY_API_URL: ${VITE_IDENTITY_API_URL:-http://localhost:8081/api/v1}
        VITE_SYNC_WS_URL: ${VITE_SYNC_WS_URL:-ws://localhost:8083/ws/sync}
        VITE_SOCIAL_WS_URL: ${VITE_SOCIAL_WS_URL:-ws://localhost:8082/ws/social}
        VITE_ANALYTICS_API_URL: ${VITE_ANALYTICS_API_URL:-http://localhost:8084/api/v1}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
    container_name: tint-web
    restart: unless-stopped
    ports:
      - "5173:5173"

  # Media worker (Python + FFmpeg): consume media:uploads, valida el vídeo subido
  # a incoming/, extrae el Ambilight y publica {id}/source.<ext> + ambilight.json.
  media-worker:
    build: ./services/media-worker
    container_name: tint-media-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tint}:${POSTGRES_PASSWORD:-tint}@postgres:5432/${POSTGRES_DB:-tint}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-tintadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-tintadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-tint-media}
      MEDIA_WORKER_CONSUMER: media-worker-1

  # Analítica (Python): consume analytics:events, guarda telemetry_events/room_kpis y
  # expone la API de solo lectura de KPIs para el host. JWT_* deben ser los de identity-api.
  analytics:
    build: ./services/analytics
    container_name: tint-analytics
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tint}:${POSTGRES_PASSWORD:-tint}@postgres:5432/${POSTGRES_DB:-tint}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      JWT_ISSUER: ${JWT_ISSUER:-tint-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tint:room}
      ANALYTICS_PORT: ${ANALYTICS_PORT:-8084}
      # Orígenes (con esquema) que pueden llamar a la API desde el navegador.
      ANALYTICS_ALLOWED_ORIGINS: ${ANALYTICS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ANALYTICS_CONSUMER: analytics-1
      # Horas sin actividad tras las que una sala se da por cerrada (REQ-07) y se consolidan sus KPIs.
      ANALYTICS_ROOM_GRACE_HOURS: ${ANALYTICS_ROOM_GRACE_HOURS:-12}
      # Zona horaria del corte del día en DAU/MAU.
      ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-America/Bogota}
      # Contraseña compartida del panel de negocio (/analitica); vacía = panel deshabilitado.
      ANALYTICS_ADMIN_PASSWORD: ${ANALYTICS_ADMIN_PASSWORD:-}
    ports:
      - "${ANALYTICS_PORT:-8084}:${ANALYTICS_PORT:-8084}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f\"http://localhost:{os.environ['ANALYTICS_PORT']}/healthz\", timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Canal Social (/ws/social): chat en vivo con historial corto en Redis.
  social-core:
    build: ./services/social-core
    container_name: tint-social-core
    ports:
      - "8082:8082"
    environment:
      SOCIAL_CORE_ADDR: ":8082"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      JWT_ISSUER: ${JWT_ISSUER:-tint-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tint:room}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-tint-login}
      # Orígenes (host[:puerto]) que pueden abrir /ws/social.
      ALLOWED_ORIGINS: ${SOCIAL_ALLOWED_ORIGINS:-localhost:5173,127.0.0.1:5173}
    depends_on:
      redis:
        condition: service_healthy

  # Canal Sync (Go). JWT_SECRET debe ser el mismo que usa identity-api.
  sync-core:
    build: ./services/sync-core
    container_name: tint-sync-core
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SYNC_CORE_ADDR: ":8080"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      JWT_ISSUER: ${JWT_ISSUER:-tint-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tint:room}
      ALLOWED_ORIGINS: ${SYNC_ALLOWED_ORIGINS:-localhost:5173,127.0.0.1:5173}
    ports:
      - "8083:8080"

volumes:
  postgres-data:
  redis-data:
  minio-data:
