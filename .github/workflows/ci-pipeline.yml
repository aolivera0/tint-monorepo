name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COVERAGE_MIN: 85

jobs:
  go:
    name: Go · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [sync-core, social-core]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Coverage gate (≥ ${{ env.COVERAGE_MIN }}%)
        run: ../../scripts/check-go-coverage.sh coverage.out "$COVERAGE_MIN"

  python:
    name: Python · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [media-worker, analytics]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: pytest + coverage gate (≥ ${{ env.COVERAGE_MIN }}%)
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under="$COVERAGE_MIN"

  web:
    name: Web · apps/web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: vitest + coverage gate (thresholds en vitest.config.ts)
        run: npx vitest run --coverage

  ci-gate:
    name: CI Gate
    if: always()
    needs: [go, python, web]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado de todos los jobs
        run: |
          echo "go=${{ needs.go.result }} python=${{ needs.python.result }} web=${{ needs.web.result }}"
          if [ "${{ needs.go.result }}" != "success" ] || \
             [ "${{ needs.python.result }}" != "success" ] || \
             [ "${{ needs.web.result }}" != "success" ]; then
            echo "::error::Pruebas o cobertura (≥ ${COVERAGE_MIN}%) no superadas. Merge bloqueado."
            exit 1
          fi
