name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COVERAGE_MIN: 85

jobs:
  go:
    name: Go · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [sync-core, social-core]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.*
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Coverage gate (≥ ${{ env.COVERAGE_MIN }}%)
        run: ../../scripts/check-go-coverage.sh coverage.out "$COVERAGE_MIN"

  python:
    name: Python · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [media-worker, analytics]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: pytest + coverage gate (≥ ${{ env.COVERAGE_MIN }}%)
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under="$COVERAGE_MIN"

  web:
    name: Web · apps/web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: vitest + coverage gate (thresholds en vitest.config.ts)
        run: npx vitest run --coverage

  identity-api:
    name: Node · identity-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/identity-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: vitest + coverage gate (thresholds en vitest.config.ts)
        run: npx vitest run --coverage

  android:
    name: Android · apps/android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: google-services.json de relleno (el real no se versiona)
        run: cp app/google-services.json.example app/google-services.json
      - name: Pruebas y cobertura (Kover, umbral en app/build.gradle.kts)
        run: ./gradlew testDebugUnitTest koverVerifyDebug
      - name: APK de debug
        run: ./gradlew assembleDebug

  # Humo de carga del Canal Sync (SYNC-TEST-01 reducido): 50 conexiones
  # reales contra sync-core + Redis. La prueba completa de 500 conexiones
  # debe correrse con k6 en una máquina distinta a la del servidor.
  sync-load-smoke:
    name: k6 · sync-core (50 VUs)
    needs: go
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      JWT_SECRET: ci-load-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/sync-core/go.mod
          cache-dependency-path: services/sync-core/go.*
      - name: Arrancar sync-core
        working-directory: services/sync-core
        run: |
          go build -o /tmp/sync-core .
          SYNC_CORE_ADDR=:8083 REDIS_URL=redis://localhost:6379 /tmp/sync-core > /tmp/sync-core.log 2>&1 &
          for i in $(seq 1 50); do curl -fs localhost:8083/healthz && exit 0; sleep 0.2; done
          cat /tmp/sync-core.log; exit 1
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "0.54.0"
      - name: k6 (umbrales de latencia, drift y autorización)
        run: >-
          k6 run -e BASE_URL=ws://localhost:8083 -e VUS=50 -e DURATION=20s -e ROOM_ID=ci-${{ github.run_id }}-${{ github.run_attempt }}
          services/sync-core/loadtest/sync.js
      - name: Métricas y logs de sync-core
        if: always()
        run: |
          curl -fs localhost:8083/metrics | grep '^sync_' || true
          tail -n 50 /tmp/sync-core.log

  ci-gate:
    name: CI Gate
    if: always()
    needs: [go, python, web, identity-api, android, sync-load-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado de todos los jobs
        run: |
          echo "go=${{ needs.go.result }} python=${{ needs.python.result }} web=${{ needs.web.result }} identity-api=${{ needs.identity-api.result }} android=${{ needs.android.result }} load=${{ needs.sync-load-smoke.result }}"
          if [ "${{ needs.go.result }}" != "success" ] || \
             [ "${{ needs.python.result }}" != "success" ] || \
             [ "${{ needs.web.result }}" != "success" ] || \
             [ "${{ needs.identity-api.result }}" != "success" ] || \
             [ "${{ needs.android.result }}" != "success" ] || \
             [ "${{ needs.sync-load-smoke.result }}" != "success" ]; then
            echo "::error::Pruebas o cobertura (≥ ${COVERAGE_MIN}%) no superadas. Merge bloqueado."
            exit 1
          fi
